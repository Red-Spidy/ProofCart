name: CI

# Backend tests and a frontend production build on every push and PR.
#
# Deliberately does NOT run `ng test`: the Angular suite is a bare CLI scaffold with no real
# specs written yet, and a green check on an empty suite is worse than no check at all. The
# backend suite is where the actual behaviour lives — including the 43-scenario policy engine
# evaluation (docs/POLICY_EVALUATION.md), which fails this build if any rule stops producing
# its expected decision.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run tests
        working-directory: backend
        run: mvn -B test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Production build
        working-directory: frontend
        run: npm run build -- --configuration production
