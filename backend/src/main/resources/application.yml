server:
  # Railway (and most PaaS hosts) inject a dynamic PORT env var and expect the app to bind to it.
  port: ${PORT:8080}

# Actuator auto-configures a Redis health indicator the moment spring-data-redis is on the
# classpath. CatalogCacheService already treats a down Redis as non-fatal (falls back to
# Postgres) — without this, /actuator/health reports DOWN whenever Redis isn't configured,
# which is exactly the case until Upstash is wired up, and it stalls the platform healthcheck
# forever even though the app itself is running fine.
management:
  health:
    redis:
      enabled: false

spring:
  application:
    name: proofcart-backend

  # ─── Database Configuration (Supabase PostgreSQL / fallback to local H2) ─────
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:proofcartdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      # 'update' is convenient for local dev (auto-creates/alters tables), but it's slower —
      # Hibernate has to diff every entity against the live schema on every boot. Set
      # JPA_DDL_AUTO=validate in production once the schema is known-correct (it already is,
      # via the supabase/migrations/*.sql files) — validate only checks, it doesn't diff+alter.
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    open-in-view: false

  # ─── Redis (Cloud Redis / Upstash / local) ──────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${REDIS_TIMEOUT:1s}
      ssl:
        # Upstash (and most managed Redis) requires TLS — set REDIS_SSL=true when using it.
        enabled: ${REDIS_SSL:false}
      # If Redis is not reachable or empty, CatalogCacheService falls through to Postgres seamlessly

# Comma-separated list — read by both WebConfig.addCorsMappings and
# SecurityConfig.corsConfigurationSource (the one that actually governs /api/**).
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

groq:
  api:
    key: ${GROQ_API_KEY:}

mcp:
  token:
    pepper: ${MCP_TOKEN_PEPPER:default-pepper}

audit:
  chain:
    secret: ${AUDIT_CHAIN_SECRET:proofcart-dev-chain-secret}

razorpay:
  key:
    id: ${RAZORPAY_KEY_ID:}
    secret: ${RAZORPAY_KEY_SECRET:}
  webhook:
    secret: ${RAZORPAY_WEBHOOK_SECRET:}

supabase:
  url: ${SUPABASE_URL:https://fqrdwzzyzckinlkryand.supabase.co}
  anon-key: ${SUPABASE_ANON_KEY:}
  jwt:
    secret: ${SUPABASE_JWT_SECRET:}
    issuer: ${SUPABASE_URL:https://fqrdwzzyzckinlkryand.supabase.co}/auth/v1
    audience: authenticated
